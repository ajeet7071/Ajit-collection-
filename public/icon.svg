    <path d="M345 270 L395 270 M345 285 L395 285 M345 270 L345 310 C365 310 385 305 385 290 C385 275 365 270 345 270 M360 305 L395 350" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
